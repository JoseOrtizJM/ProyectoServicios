components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AddCardRequest:
      type: object
      description: |-
        Simulado: card_number y cvv se validan por formato pero JAMÁS se
        persisten — solo se guardan marca + últimos 4 dígitos.
      properties:
        card_number:
          type: string
          writeOnly: true
          minLength: 1
        cvv:
          type: string
          writeOnly: true
        exp_month:
          type: integer
          maximum: 12
          minimum: 1
        exp_year:
          type: integer
          minimum: 2000
        alias:
          type: string
          default: ''
          maxLength: 50
      required:
      - card_number
      - exp_month
      - exp_year
    AddCartItemRequest:
      type: object
      properties:
        product_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - product_id
    AdminUser:
      type: object
      description: |-
        A diferencia de UserProfileSerializer (el usuario editando su propio
        nombre), este serializer lo usa el admin y sí puede tocar role/is_active.
        El email queda de solo lectura: es el identificador de login, cambiarlo
        tiene implicaciones aparte que no se piden en este sprint.
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        role:
          $ref: '#/components/schemas/AdminUserRoleEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - updated_at
    AdminUserRoleEnum:
      enum:
      - user
      - admin
      type: string
      description: |-
        * `user` - user
        * `admin` - admin
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - tokens
      - user
    Brand:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          default: ''
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          default: ''
          maxLength: 500
      required:
      - name
    Cart:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_items:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - items
      - total
      - total_items
      - updated_at
    CartItem:
      type: object
      description: |-
        Representa un CartItem embebido, con precio y subtotal calculados
        al momento (siempre reflejan el precio actual del producto, no uno
        congelado — eso se "congela" recién en el pedido, Sprint 5).
      properties:
        product:
          type: string
          readOnly: true
        quantity:
          type: integer
        unit_price:
          type: string
          readOnly: true
        subtotal:
          type: string
          readOnly: true
      required:
      - product
      - quantity
      - subtotal
      - unit_price
    Category:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          default: ''
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          default: ''
          maxLength: 500
      required:
      - name
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    ChatHistoryInRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleDa6Enum'
        content:
          type: string
          minLength: 1
      required:
      - content
      - role
    ChatHistoryOut:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleDa6Enum'
        content:
          type: string
      required:
      - content
      - role
    ChatRequestRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          description: La pregunta del usuario para el chatbot.
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatHistoryInRequest'
          description: Turnos previos de la conversación, tal como los devolvió la
            respuesta anterior.
      required:
      - message
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatHistoryOut'
      required:
      - history
      - reply
    CheckoutRequest:
      type: object
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        card_id:
          type: string
        card_number:
          type: string
          writeOnly: true
        cvv:
          type: string
          writeOnly: true
        exp_month:
          type: integer
          maximum: 12
          minimum: 1
        exp_year:
          type: integer
          minimum: 2000
        save_card:
          type: boolean
          default: false
        card_alias:
          type: string
          default: ''
          maxLength: 50
      required:
      - payment_method
    DashboardCatalog:
      type: object
      properties:
        total_active_products:
          type: integer
        total_categories:
          type: integer
        total_brands:
          type: integer
      required:
      - total_active_products
      - total_brands
      - total_categories
    DashboardSales:
      type: object
      properties:
        total_orders:
          type: integer
        total_revenue:
          type: string
        orders_by_status:
          $ref: '#/components/schemas/OrdersByStatus'
      required:
      - orders_by_status
      - total_orders
      - total_revenue
    DashboardSummary:
      type: object
      properties:
        sales:
          $ref: '#/components/schemas/DashboardSales'
        top_selling_products:
          type: array
          items:
            $ref: '#/components/schemas/TopSellingProduct'
        catalog:
          $ref: '#/components/schemas/DashboardCatalog'
        users:
          $ref: '#/components/schemas/DashboardUsers'
        recent_orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
      - catalog
      - recent_orders
      - sales
      - top_selling_products
      - users
    DashboardUsers:
      type: object
      properties:
        total_users:
          type: integer
        total_admins:
          type: integer
        blocked_users:
          type: integer
      required:
      - blocked_users
      - total_admins
      - total_users
    Detail:
      type: object
      description: |-
        Respuesta genérica {"detail": "..."} usada por varios endpoints
        (logout, cambio de contraseña, errores, etc.).
      properties:
        detail:
          type: string
      required:
      - detail
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        mongo_connected:
          type: boolean
        mongo_error:
          type: string
          nullable: true
        users_count:
          type: integer
          nullable: true
      required:
      - mongo_connected
      - mongo_error
      - status
      - users_count
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Order:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        payment_method:
          type: string
          readOnly: true
        card:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - card
      - created_at
      - id
      - items
      - payment_method
      - status
      - total
      - updated_at
      - user
    OrderItem:
      type: object
      properties:
        product_id:
          type: string
          readOnly: true
        product_name:
          type: string
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
        subtotal:
          type: string
          readOnly: true
      required:
      - product_id
      - product_name
      - quantity
      - subtotal
      - unit_price
    OrdersByStatus:
      type: object
      properties:
        pending_payment:
          type: integer
        paid:
          type: integer
        shipped:
          type: integer
        delivered:
          type: integer
        cancelled:
          type: integer
      required:
      - cancelled
      - delivered
      - paid
      - pending_payment
      - shipped
    PaginatedAdminOrderList:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
      - count
      - page
      - page_size
      - results
      - total_pages
    PaginatedBrandList:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
      required:
      - count
      - page
      - page_size
      - results
      - total_pages
    PaginatedCategoryList:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - count
      - page
      - page_size
      - results
      - total_pages
    PaginatedOrderList:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
      - count
      - page
      - page_size
      - results
      - total_pages
    PaginatedProductList:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
      - count
      - page
