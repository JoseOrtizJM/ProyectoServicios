openapi: 3.0.3
info:
  title: Tienda en Línea — API
  version: 1.0.0
  description: 'API REST de la tienda en línea de artículos tecnológicos. Autenticación
    con JWT (Bearer). Moneda: MXN.'
paths:
  /api/auth/admin/users/:
    get:
      operationId: auth_admin_users_retrieve
      summary: Listar usuarios (admin)
      parameters:
      - in: query
        name: is_active
        schema:
          type: string
        description: Filtrar por 'true' o 'false'.
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página (por defecto 1).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Resultados por página (por defecto 12, máximo 50).
      - in: query
        name: role
        schema:
          type: string
        description: 'Filtrar por rol: ''user'' o ''admin''.'
      - in: query
        name: search
        schema:
          type: string
        description: Búsqueda parcial por email.
      tags:
      - Admin — Usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/auth/admin/users/{user_id}/:
    get:
      operationId: auth_admin_users_retrieve_2
      summary: Ver un usuario (admin)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - Admin — Usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: auth_admin_users_partial_update
      description: is_active=false bloquea, is_active=true desbloquea. Un admin no
        puede bloquearse ni quitarse su propio rol a sí mismo.
      summary: Editar / cambiar rol / bloquear-desbloquear usuario (admin)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - Admin — Usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: auth_admin_users_destroy
      description: 'Atajo semántico: en vez de eliminar, pone is_active=False. Conserva
        su historial de pedidos y reseñas.'
      summary: Bloquear usuario (admin)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - Admin — Usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Cambiar mi contraseña
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Iniciar sesión
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalida el refresh token enviado (blacklist). El access token
        en uso sigue siendo válido hasta que expire naturalmente (máx. JWT_ACCESS_TOKEN_MINUTES).
      summary: Cerrar sesión
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      summary: Ver mi perfil
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      description: Solo first_name/last_name son editables aquí — email, role e is_active
        no se pueden auto-modificar.
      summary: Editar mi perfil
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Cambia un refresh token válido (no invalidado) por un access token
        nuevo.
      summary: Renovar el access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Crea una cuenta con role='user' y devuelve el par de tokens (access/refresh).
      summary: Registrar un nuevo usuario
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: Se crea automáticamente (vacío) si el usuario todavía no tiene
        uno.
      summary: Ver mi carrito
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_destroy
      summary: Vaciar mi carrito
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cart/items/:
    post:
      operationId: cart_items_create
      description: Si el producto ya está en el carrito, suma la cantidad a la existente.
        Valida que no se exceda el stock disponible.
      summary: Agregar producto al carrito
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/cart/items/{product_id}/:
    patch:
      operationId: cart_items_partial_update
      summary: Fijar cantidad de un producto en el carrito
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: cart_items_destroy
      summary: Quitar un producto del carrito
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/catalog/brands/:
    get:
      operationId: catalog_brands_retrieve
      summary: Listar marcas (público)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página (por defecto 1).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Resultados por página (por defecto 12, máximo 50).
      tags:
      - Catálogo — Marcas
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'
          description: ''
    post:
      operationId: catalog_brands_create
      summary: Crear marca (admin)
      tags:
      - Catálogo — Marcas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
  /api/catalog/brands/{brand_id}/:
    get:
      operationId: catalog_brands_retrieve_2
      summary: Ver marca (público)
      parameters:
      - in: path
        name: brand_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Marcas
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    put:
      operationId: catalog_brands_update
      summary: Editar marca (admin)
      parameters:
      - in: path
        name: brand_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Marcas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    patch:
      operationId: catalog_brands_partial_update
      summary: Editar marca (admin)
      parameters:
      - in: path
        name: brand_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Marcas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBrandRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBrandRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBrandRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    delete:
      operationId: catalog_brands_destroy
      description: Falla con 409 si hay productos asociados a la marca.
      summary: Eliminar marca (admin)
      parameters:
      - in: path
        name: brand_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Marcas
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/catalog/categories/:
    get:
      operationId: catalog_categories_retrieve
      summary: Listar categorías (público)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página (por defecto 1).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Resultados por página (por defecto 12, máximo 50).
      tags:
      - Catálogo — Categorías
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: catalog_categories_create
      summary: Crear categoría (admin)
      tags:
      - Catálogo — Categorías
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/catalog/categories/{category_id}/:
    get:
      operationId: catalog_categories_retrieve_2
      summary: Ver categoría (público)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Categorías
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: catalog_categories_update
      summary: Editar categoría (admin)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Categorías
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: catalog_categories_partial_update
      summary: Editar categoría (admin)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Categorías
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: catalog_categories_destroy
      description: Falla con 409 si hay productos asociados a la categoría.
      summary: Eliminar categoría (admin)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Categorías
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/catalog/products/:
    get:
      operationId: catalog_products_retrieve
      description: Solo devuelve productos activos. Admite filtros y paginación.
      summary: Listar productos (público)
      parameters:
      - in: query
        name: brand
        schema:
          type: string
        description: ID de marca para filtrar.
      - in: query
        name: category
        schema:
          type: string
        description: ID de categoría para filtrar.
      - in: query
        name: max_price
        schema:
          type: string
        description: Precio máximo (MXN).
      - in: query
        name: min_price
        schema:
          type: string
        description: Precio mínimo (MXN).
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página (por defecto 1).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Resultados por página (por defecto 12, máximo 50).
      - in: query
        name: search
        schema:
          type: string
        description: Búsqueda parcial por nombre.
      tags:
      - Catálogo — Productos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: catalog_products_create
      summary: Crear producto (admin)
      tags:
      - Catálogo — Productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/catalog/products/{product_id}/:
    get:
      operationId: catalog_products_retrieve_2
      description: Productos desactivados devuelven 404 salvo que quien pregunta sea
        admin.
      summary: Ver producto (público)
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Productos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    put:
      operationId: catalog_products_update
      summary: Editar producto (admin)
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: catalog_products_partial_update
      summary: Editar producto (admin)
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: catalog_products_destroy
      description: 'Soft delete: pone is_active=False. No se borra de verdad, para
        no romper reseñas/pedidos que ya lo referencian.'
      summary: Desactivar producto (admin)
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Catálogo — Productos
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/chatbot/chat/:
    post:
      operationId: chatbot_chat_create
      description: Usa Claude con tool use sobre datos reales de Mongo (más vendido,
        mejor valorado, más barato, búsqueda). Reenvía el 'history' de la respuesta
        anterior para mantener contexto entre preguntas.
      summary: Preguntarle al chatbot con IA
      tags:
      - Chatbot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
