# Blueprint de Render (Infrastructure as Code).
# Al conectar el repo en render.com, Render detecta este archivo y
# preconfigura el servicio. Las variables marcadas "sync: false" son
# secretos que se cargan manualmente desde el dashboard de Render, nunca
# desde este archivo.
#
# IMPORTANTE: Render no ofrece MongoDB como base de datos administrada.
# Para producción se necesita un cluster de MongoDB Atlas (free tier
# sirve para empezar) y pasar su connection string en MONGO_URI.

services:
  - type: web
    name: proyecto-servicios-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0" # ajustar según versiones soportadas por Render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: MONGO_URI
        sync: false # connection string de MongoDB Atlas
      - key: CORS_ALLOWED_ORIGINS
        sync: false # dominios del frontend web/móvil en producción
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_DAYS
        value: "7"
      - key: ANTHROPIC_API_KEY
        sync: false
